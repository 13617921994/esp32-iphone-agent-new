name: Build IPA (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
jobs:
  ipa:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -project IPhoneAgent.xcodeproj -list
      - name: Build (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project IPhoneAgent.xcodeproj -scheme IPhoneAgent \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build | tee build.log
      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/IPhoneAgent.app"
          test -d "$APP" || { ls -R build/Build/Products | head -50; exit 1; }
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload IPhoneAgent-unsigned.ipa
          ls -lh IPhoneAgent-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-unsigned-ipa
          path: ios/IPhoneAgent-unsigned.ipa
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore
